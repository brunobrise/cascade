<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="cascadeMonoTitle cascadeMonoDesc">
  <title id="cascadeMonoTitle">Cascade App Icon - Monochrome</title>
  <desc id="cascadeMonoDesc">Single-color vector icon for Cascade matching the system status bar symbol using currentColor.</desc>
  <defs>
    <!-- Knockout mask: Front window cuts out rear window lines with 12px margin -->
    <mask id="cutoutFrontWin">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="158" y="180" width="254" height="204" rx="42" fill="#000000"/>
    </mask>
  </defs>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Container (macOS Squircle Frame) -->
    <rect x="52" y="52" width="408" height="408" rx="88" stroke-width="14"/>

    <!-- Rear Window Frame (Masked by Front Window) -->
    <g mask="url(#cutoutFrontWin)">
      <rect x="118" y="142" width="206" height="152" rx="28" stroke-width="26"/>
    </g>

    <!-- Front Active Window Frame -->
    <rect x="174" y="196" width="222" height="172" rx="34" stroke-width="28"/>

    <!-- Three Header Dots -->
    <circle cx="226" cy="242" r="10.5" fill="currentColor" stroke="none"/>
    <circle cx="258" cy="242" r="10.5" fill="currentColor" stroke="none"/>
    <circle cx="290" cy="242" r="10.5" fill="currentColor" stroke="none"/>
  </g>
</svg>
