<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-labelledby="cascadeSmallTitle cascadeSmallDesc">
  <title id="cascadeSmallTitle">Cascade Favicon - Small</title>
  <desc id="cascadeSmallDesc">Optically tuned small-size icon for Cascade matching the system status bar symbol.</desc>
  <defs>
    <mask id="smallCutout">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <rect x="18" y="20" width="38" height="32" rx="8" fill="#000000"/>
    </mask>
  </defs>

  <!-- Rear Window Frame -->
  <g mask="url(#smallCutout)">
    <rect x="8" y="10" width="32" height="26" rx="5" fill="none" stroke="#9CA3AF" stroke-width="4.5"/>
  </g>

  <!-- Front Window Frame -->
  <rect x="22" y="24" width="34" height="28" rx="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="5"/>
  
  <!-- Header Dots -->
  <circle cx="30" cy="31" r="2" fill="#FFFFFF"/>
  <circle cx="36" cy="31" r="2" fill="#FFFFFF"/>
  <circle cx="42" cy="31" r="2" fill="#FFFFFF"/>
</svg>
