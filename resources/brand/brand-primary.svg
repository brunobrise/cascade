<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="cascadePrimaryTitle cascadePrimaryDesc">
  <title id="cascadePrimaryTitle">Cascade App Icon - Primary</title>
  <desc id="cascadePrimaryDesc">Minimalist brand icon for Cascade macOS window manager showing three staggered cascading window planes with signature unoccluded click tabs.</desc>
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Window Gradients -->
    <linearGradient id="win1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="win2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243247" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#131B2B" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="win3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3E56" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#172233" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Tab Accent Gradients -->
    <linearGradient id="tabGradActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="tabGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="tabGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.70"/>
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="winShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Master Canvas Squircle (macOS Big Sur 824/1024 proportional ratio) -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bgGrad)" filter="url(#squircleShadow)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="50" y="50" width="412" height="206" rx="92" fill="url(#sheenGrad)"/>

  <!-- Subtle Radial Backdrop Glow -->
  <circle cx="256" cy="256" r="160" fill="#38BDF8" fill-opacity="0.03" filter="blur(30px)"/>

  <!-- ==================== WINDOW 1 (Back) ==================== -->
  <g id="window-back" filter="url(#winShadow)">
    <rect x="96" y="112" width="220" height="154" rx="14" fill="url(#win1Grad)" stroke="#475569" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Unoccluded Top-Right Click Tab 1 -->
    <path d="M 282 112 L 302 112 A 14 14 0 0 1 316 126 L 316 146 L 282 146 Z" fill="url(#tabGradBack)"/>
    <circle cx="299" cy="129" r="3.5" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- ==================== WINDOW 2 (Middle) ==================== -->
  <g id="window-mid" filter="url(#winShadow)">
    <rect x="146" y="162" width="220" height="154" rx="14" fill="url(#win2Grad)" stroke="#64748B" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Unoccluded Top-Right Click Tab 2 -->
    <path d="M 332 162 L 352 162 A 14 14 0 0 1 366 176 L 366 196 L 332 196 Z" fill="url(#tabGradMid)"/>
    <circle cx="349" cy="179" r="3.5" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- ==================== WINDOW 3 (Front Active) ==================== -->
  <g id="window-front" filter="url(#winShadow)">
    <rect x="196" y="212" width="220" height="154" rx="14" fill="url(#win3Grad)" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.75"/>
    
    <!-- Title Bar Division -->
    <line x1="196" y1="238" x2="416" y2="238" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    
    <!-- Minimalist Precision Dot Indicators -->
    <circle cx="212" cy="225" r="3.5" fill="#F43F5E" fill-opacity="0.85"/>
    <circle cx="224" cy="225" r="3.5" fill="#FBBF24" fill-opacity="0.85"/>
    <circle cx="236" cy="225" r="3.5" fill="#10B981" fill-opacity="0.85"/>

    <!-- Unoccluded Top-Right Click Tab 3 -->
    <path d="M 382 212 L 402 212 A 14 14 0 0 1 416 226 L 416 246 L 382 246 Z" fill="url(#tabGradActive)"/>
    <circle cx="399" cy="229" r="3.5" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Minimal Geometric Content Lines -->
    <rect x="214" y="258" width="80" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="214" y="272" width="130" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.15"/>
    <rect x="214" y="286" width="105" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.10"/>
  </g>
</svg>
