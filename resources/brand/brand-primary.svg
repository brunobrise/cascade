<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="cascadePrimaryTitle cascadePrimaryDesc">
  <title id="cascadePrimaryTitle">Cascade App Icon - Primary</title>
  <desc id="cascadePrimaryDesc">Minimalist native macOS icon for Cascade matching the system status bar symbol with two cascading windows.</desc>
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Squircle Shadow -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="frontShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Master Squircle Container (macOS HIG 824/1024 ratio) -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bgGrad)" filter="url(#squircleShadow)" stroke="#374151" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="50" y="50" width="412" height="206" rx="92" fill="url(#sheenGrad)"/>

  <!-- ==================== REAR WINDOW (Background Layer) ==================== -->
  <rect x="118" y="142" width="206" height="152" rx="28" fill="#1F2937" fill-opacity="0.65" stroke="#9CA3AF" stroke-width="26" stroke-linejoin="round"/>

  <!-- ==================== FRONT WINDOW (macOS Active Window) ==================== -->
  <g filter="url(#frontShadow)">
    <!-- Window Body Frame -->
    <rect x="174" y="196" width="222" height="172" rx="34" fill="#0B0F19" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
    
    <!-- Three Minimalist Header Dots -->
    <circle cx="226" cy="242" r="10.5" fill="#FFFFFF"/>
    <circle cx="258" cy="242" r="10.5" fill="#FFFFFF"/>
    <circle cx="290" cy="242" r="10.5" fill="#FFFFFF"/>
  </g>
</svg>
