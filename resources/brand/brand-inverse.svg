<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="cascadeInverseTitle cascadeInverseDesc">
  <title id="cascadeInverseTitle">Cascade App Icon - Inverse</title>
  <desc id="cascadeInverseDesc">High-contrast dark-mode variant for Cascade with luminous strokes and radiant cyan click tabs.</desc>
  <defs>
    <linearGradient id="invTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadows for layer separation in dark mode -->
    <filter id="invGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.80"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Base Plate -->
  <rect x="52" y="52" width="408" height="408" rx="88" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>

  <!-- Window 1 (Back) -->
  <g filter="url(#invGlow)">
    <rect x="96" y="112" width="220" height="154" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
    <path d="M 282 112 L 302 112 A 14 14 0 0 1 316 126 L 316 146 L 282 146 Z" fill="#0369A1"/>
    <circle cx="299" cy="129" r="3" fill="#E2E8F0"/>
  </g>

  <!-- Window 2 (Middle) -->
  <g filter="url(#invGlow)">
    <rect x="146" y="162" width="220" height="154" rx="14" fill="#131D31" stroke="#475569" stroke-width="2.5"/>
    <path d="M 332 162 L 352 162 A 14 14 0 0 1 366 176 L 366 196 L 332 196 Z" fill="#0EA5E9"/>
    <circle cx="349" cy="179" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Window 3 (Front) -->
  <g filter="url(#invGlow)">
    <rect x="196" y="212" width="220" height="154" rx="14" fill="#1E293B" stroke="#F8FAFC" stroke-width="2.5"/>
    
    <!-- Title Bar -->
    <line x1="196" y1="238" x2="416" y2="238" stroke="#475569" stroke-width="1.5"/>
    <circle cx="212" cy="225" r="3" fill="#F43F5E"/>
    <circle cx="224" cy="225" r="3" fill="#FBBF24"/>
    <circle cx="236" cy="225" r="3" fill="#10B981"/>

    <!-- High-Luminance Top-Right Click Tab 3 -->
    <path d="M 382 212 L 402 212 A 14 14 0 0 1 416 226 L 416 246 L 382 246 Z" fill="url(#invTabGrad)"/>
    <circle cx="399" cy="229" r="3.5" fill="#FFFFFF"/>

    <!-- Minimal Content Indicators -->
    <line x1="214" y1="262" x2="300" y2="262" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="214" y1="276" x2="340" y2="276" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
